<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GoldAI PRO V2</title>

<style>

/* ==================================================
GOLD AI PRO V2
SECTION 01 - BASE THEME
================================================== */

*{
box-sizing:border-box;
}

body{
margin:0;
padding:15px;
background:#090909;
color:#fff;
font-family:Arial,sans-serif;
}

.container{
max-width:450px;
margin:auto;
}

.card{
background:#151515;
border:1px solid #333;
border-radius:15px;
padding:15px;
margin-bottom:12px;
}

.title{
text-align:center;
color:#d4af37;
font-size:22px;
font-weight:bold;
}

.gold{
color:#d4af37;
}

.green{
color:#00ff88;
}

.red{
color:#ff4444;
}

.yellow{
color:#ffd700;
}

button{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:12px;
background:#d4af37;
color:#000;
font-size:16px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">
<!-- ==================================================
SECTION 02 - DASHBOARD
================================================== -->

<div class="card">

<div class="title">
🥇 GoldAI PRO V2
</div>

<div style="text-align:center;margin-top:10px;">
<div class="gold" style="font-size:18px;">
XAUUSD
</div>

<div id="price" style="font-size:32px;font-weight:bold;">
4153.82
</div>
</div>

<div style="text-align:center;margin-top:12px;" class="green">
🟢 MARKET OPEN
</div>

</div>


<div class="card">

<div style="display:flex;justify-content:space-between;">
<span>Trend</span>
<span id="trend">WAIT</span>
</div>

<div style="display:flex;justify-content:space-between;margin-top:8px;">
<span>Session</span>
<span id="session">London</span>
</div>

<div style="display:flex;justify-content:space-between;margin-top:8px;">
<span>Quality</span>
<span id="quality">★★★★★</span>
</div>

</div>


<div class="card" style="text-align:center;">

<div id="signal" style="font-size:28px;font-weight:bold;">
WAIT 🟡
</div>

<div style="margin-top:10px;">
Confidence
</div>

<div id="confidence" class="green" style="font-size:26px;font-weight:bold;">
0%
</div>

</div>
<!-- ==================================================
SECTION 03 - TRADE CARD
================================================== -->

<div class="card">

<div style="text-align:center;font-size:22px;font-weight:bold;">
TRADE SETUP
</div>

<div style="margin-top:12px;">

<p style="display:flex;justify-content:space-between;">
<span>Entry</span>
<span id="entry" class="gold">-</span>
</p>

<p style="display:flex;justify-content:space-between;">
<span>Stop Loss</span>
<span id="sl" class="red">-</span>
</p>

<p style="display:flex;justify-content:space-between;">
<span>TP1</span>
<span id="tp1" class="green">-</span>
</p>

<p style="display:flex;justify-content:space-between;">
<span>TP2</span>
<span id="tp2" class="green">-</span>
</p>

<p style="display:flex;justify-content:space-between;">
<span>TP3</span>
<span id="tp3" class="green">-</span>
</p>

<p style="display:flex;justify-content:space-between;">
<span>Risk / Reward</span>
<span id="rr" class="gold">-</span>
</p>

</div>

<button>
START ANALYSIS
</button>

</div>
<!-- ==================================================
SECTION 04 - RISK INFO
================================================== -->

<div class="card">

<div style="text-align:center;font-size:20px;font-weight:bold;">
ACCOUNT
</div>

<p style="display:flex;justify-content:space-between;">
<span>Lot</span>
<span id="lot" class="gold">0.01</span>
</p>

<p style="display:flex;justify-content:space-between;">
<span>Capital</span>
<span id="capital" class="gold">100$</span>
</p>

<p style="display:flex;justify-content:space-between;">
<span>Risk</span>
<span id="risk" class="gold">2%</span>
</p>

</div>


<div class="card">

<div style="text-align:center;font-size:20px;font-weight:bold;">
PRICE SOURCE
</div>

<p style="display:flex;justify-content:space-between;">
<span>Source</span>
<span id="source" class="green">
LIVE
</span>
</p>

<p style="display:flex;justify-content:space-between;">
<span>Manual Entry</span>
<span id="manualPrice">
OFF
</span>
</p>

</div>
<!-- ==================================================
SECTION 05 - NAVIGATION
================================================== -->

<div class="card">

<button>
📊 Details
</button>

<button>
📜 History
</button>

<button>
⚙ Settings
</button>

</div>
</div>

</body>
</html>
