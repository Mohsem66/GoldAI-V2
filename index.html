<script>

/* ==================================================
SECTION 06-A
GOLD AI PRO V2 CORE ENGINE
================================================== */

const GoldAI_Core = {

version:"2.0",

symbol:"XAUUSD",

priceSource:"LIVE",

price:4153.82,

capital:100,

lot:0.01,

risk:2,

signal:"WAIT",

confidence:0,


updateDashboard:function(){

document.getElementById("price").innerHTML =
this.price.toFixed(2);

document.getElementById("signal").innerHTML =
this.signal+" 🟡";

document.getElementById("confidence").innerHTML =
this.confidence+"%";

document.getElementById("lot").innerHTML =
this.lot;

document.getElementById("capital").innerHTML =
this.capital+"$";

document.getElementById("risk").innerHTML =
this.risk+"%";

}

};

GoldAI_Core.updateDashboard();

</script>
<script>

/* ==================================================
SECTION 06-B
PRICE SOURCE ENGINE
================================================== */

const GoldAI_Price = {

mode:"LIVE",

livePrice:4153.82,

manualPrice:null,

mt5Price:null,


getPrice:function(){

if(this.mode==="MANUAL" && this.manualPrice){

return this.manualPrice;

}


if(this.mode==="MT5" && this.mt5Price){

return this.mt5Price;

}


return this.livePrice;

},


setManual:function(price){

this.manualPrice=Number(price);

},


setMT5:function(price){

this.mt5Price=Number(price);

}

};



GoldAI_Core.price =
GoldAI_Price.getPrice();


GoldAI_Core.updateDashboard();

</script>
<script>

/* ==================================================
SECTION 07-A
EMA ENGINE
================================================== */

const GoldAI_EMA = {


calculate:function(data,period){

if(data.length < period){
return null;
}


let sum = 0;

for(let i=data.length-period;i<data.length;i++){

sum += data[i];

}


return (sum/period).toFixed(2);

},


EMA20:function(data){

return this.calculate(data,20);

},


EMA50:function(data){

return this.calculate(data,50);

},


EMA200:function(data){

return this.calculate(data,200);

}


};


</script>
<script>

/* ==================================================
SECTION 07-B
RSI ENGINE V2
================================================== */

const GoldAI_RSI = {


calculate:function(data,period=14){

if(data.length <= period){

return null;

}


let gains=0;
let losses=0;


for(let i=data.length-period;i<data.length;i++){

let diff=data[i]-data[i-1];


if(diff>0){

gains += diff;

}
else{

losses -= diff;

}

}


if(losses===0){

return 100;

}


let rs=gains/losses;


let rsi=100-(100/(1+rs));


return Number(rsi.toFixed(2));

},


zone:function(rsi){

if(rsi>=70){

return "OVERBOUGHT";

}

if(rsi<=30){

return "OVERSOLD";

}

return "NORMAL";

}


};


</script>
<script>
/* ==================================================
SECTION 07-C
MACD ENGINE
================================================== */

const GoldAI_MACD={

calculate:function(data){

if(data.length<26){
return null;
}

let ema12=0;
let ema26=0;

for(let i=data.length-12;i<data.length;i++){
ema12+=data[i];
}

for(let i=data.length-26;i<data.length;i++){
ema26+=data[i];
}

ema12=ema12/12;
ema26=ema26/26;

let macd=ema12-ema26;

return Number(macd.toFixed(2));

},

signal:function(macd){

if(macd>0){
return "BULLISH";
}

if(macd<0){
return "BEARISH";
}

return "NEUTRAL";

}

};
</script>
